services:
  db:
    container_name: postgres
    image: postgres:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    container_name: redis
    image: redis:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres_data:
  redis-data: